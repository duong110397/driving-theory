# Render Blueprint: https://render.com/docs/blueprint-spec
# Database is external (Neon free tier); paste its connection string as DATABASE_URL when prompted.
services:
  - type: web
    name: driving-theory
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL_REQUIRE
        value: "true"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"
      - key: WEB_CONCURRENCY
        value: "2"
